<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - StayKita</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <header>
    <div class="bar">
      <a class="logo" href="index.html">🏡 StayKita</a>
      <nav>
        <a href="index.html">Beranda</a>
        <a href="kamar.html">Kamar</a>
        <a href="booking.html">Booking</a>
        <a href="tentang.html">Tentang</a>
        <a href="login.html" class="aktif" aria-current="page">Login</a>
      </nav>
    </div>
  </header>

  <main class="halaman-login">
    <form id="formLogin" class="kartu-login" novalidate>
      <h1>Login</h1>

      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button class="btn" type="submit">Masuk</button>
      <p class="pesan" id="pesan" role="alert" aria-live="polite"></p>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 StayKita - Booking Homestay Salatiga. Dibuat oleh Kelompok TR.</p>
  </footer>

  <script src="../js/login.js"></script>
</body>

</html>
